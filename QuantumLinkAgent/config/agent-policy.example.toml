# Example QuantumLink Agent policy.
# This file is documentation scaffold, not a production default.

[identity]
mode = "verified"
trust_policy = "private-preferred"
verification_cache_ttl_seconds = 300

[mesh]
allow_relay_fallback = true
fail_closed_for_protected_routes = true
default_route_mode = "split"

[privacy]
redact_peer_ips = true
redact_dns = true
allow_raw_diagnostics_export = false
publish_routes_on_chain = false
publish_endpoint_candidates_on_chain = false

[agent]
recommendation_mode = "typed"
autonomous_actions_enabled = false
audit_log_enabled = true

[actions.low_risk_apply]
rotate_stale_rendezvous_record = true
retry_candidate_gathering = true
clear_expired_diagnostic_cache = true

[actions.approval_required]
trust_new_peer = true
weaken_identity_policy = true
disable_fail_closed_routing = true
allow_sensitive_relay = true
export_raw_diagnostics = true
clear_quarantine = true

[package]
name = "qlinkctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
qlink-game = { path = "../qlink-game" }
qlink-proto = { path = "../qlink-proto" }
qlink-core = { path = "../../../../qlink-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time"] }

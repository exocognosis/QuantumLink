name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: Rust workspace (shared core + cross-platform silo code)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      # Workspace covers qlink-core plus the Windows silo's cross-platform
      # crates (quantumlink-proto, the non-Windows parts of
      # quantumlink-service). Windows-only modules are cfg-gated and built
      # in windows-ci.yml.
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust QUIC smoke
        run: cargo run -p qlink-core --bin qlinkctl -- quic-loopback
      - name: Rust mesh and relay smokes
        run: |
          cargo run -p qlink-core --bin qlinkctl -- mesh-loopback
          cargo run -p qlink-core --bin qlinkctl -- relay-loopback

  macos:
    name: macOS silo (Swift + XCFramework)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      # Build the shared core dylib once at the workspace root.
      - name: Build shared core
        run: cargo build -p qlink-core --release
      - name: Swift tests
        working-directory: macos
        run: swift test
      - name: Swift transport smoke
        working-directory: macos
        run: |
          swift run QuantumLinkSmoke validate-config --config ../config/mesh.example.json
          swift run QuantumLinkSmoke preflight \
            --config ../config/mesh.example.json \
            --transport \
            --mode dev-quic-loopback \
            --dylib "$PWD/../target/release/libqlink_core.dylib"
      - name: Rust XCFramework
        working-directory: macos
        run: ./scripts/build-rust-xcframework.sh
      - name: Development artifact package
        working-directory: macos
        run: ./scripts/package-dev-artifacts.sh

  xcodegen-smoke:
    name: Unsigned Xcode project smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build shared core
        run: cargo build -p qlink-core --release
      - name: Generate unsigned project
        working-directory: macos
        run: ./scripts/generate-xcode-project.sh
      - name: Build unsigned app target
        working-directory: macos
        run: |
          xcodebuild \
            -project QuantumLink.xcodeproj \
            -scheme QuantumLink \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

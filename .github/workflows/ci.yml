name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: Rust workspace (shared core + cross-platform silo code)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      # Workspace covers qlink-core plus the Windows silo's cross-platform
      # crates (quantumlink-proto, the non-Windows parts of
      # quantumlink-service). Windows-only modules are cfg-gated and built
      # in windows-ci.yml.
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust QUIC smoke
        run: cargo run -p qlink-core --bin qlinkctl -- quic-loopback
      - name: Rust mesh and relay smokes
        run: |
          cargo run -p qlink-core --bin qlinkctl -- mesh-loopback
          cargo run -p qlink-core --bin qlinkctl -- relay-loopback

  macos:
    name: macOS silo (Swift + XCFramework)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      # Build the shared core dylib once at the workspace root.
      - name: Build shared core
        run: cargo build -p qlink-core --release
      # The XCFramework step builds a universal (arm64 + x86_64) static
      # library, so both Apple targets must be installed.
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: macOS release readiness
        working-directory: macos
        run: ./scripts/macos-release-readiness.sh
      - name: Swift tests
        working-directory: macos
        run: swift test
      - name: Swift transport smoke
        working-directory: macos
        run: |
          swift run QuantumLinkSmoke validate-config --config ../config/mesh.example.json
          swift run QuantumLinkSmoke preflight \
            --config ../config/mesh.example.json \
            --transport \
            --mode dev-quic-loopback \
            --dylib "$PWD/../target/release/libqlink_core.dylib"
      - name: Rust XCFramework
        working-directory: macos
        run: ./scripts/build-rust-xcframework.sh
      - name: Development artifact package
        working-directory: macos
        run: ./scripts/package-dev-artifacts.sh
      - name: Upload development artifact package
        uses: actions/upload-artifact@v4
        with:
          name: QuantumLink-dev-${{ github.sha }}
          path: |
            macos/build/dist/QuantumLink-dev.tar.gz
            macos/build/dist/QuantumLink-dev.tar.gz.sha256
          if-no-files-found: error

  xcodegen-smoke:
    name: Unsigned Xcode project smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Rust XCFramework
        working-directory: macos
        run: QLINK_RUST_TARGETS="$(rustc -vV | awk '/^host:/ { print $2 }')" ./scripts/build-rust-xcframework.sh
      - name: Generate unsigned project
        working-directory: macos
        # generate-xcode-project.sh re-runs build-rust-xcframework.sh; keep it
        # host-only (matching the step above) so it does not require the
        # x86_64 cross-target, which this smoke job does not install.
        run: QLINK_RUST_TARGETS="$(rustc -vV | awk '/^host:/ { print $2 }')" ./scripts/generate-xcode-project.sh
      - name: Build unsigned app target
        working-directory: macos
        run: |
          xcodebuild \
            -project QuantumLink.xcodeproj \
            -scheme QuantumLink \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

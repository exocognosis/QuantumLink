name: Performance

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    # Weekly at 06:00 UTC Monday: catches cross-merge regressions even
    # when nobody fires workflow_dispatch.
    - cron: "0 6 * * 1"

jobs:
  rust-benchmarks:
    name: Rust criterion benches + SLO scenarios
    runs-on: macos-15
    env:
      # Bench output is verbose; the SLO scenarios use println! to emit
      # one machine-parseable line per scenario.
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('Cargo.lock') }}

      - name: Pre-build dylib (for Swift step + cache warming)
        run: cargo build -p qlink-core --release

      - name: Run SLO scenarios (asserts product.md targets)
        id: slos
        run: |
          set -o pipefail
          cargo bench -p qlink-core --bench slos 2>&1 | tee build/perf-slos.log
          # Surface the slo.* lines as a job summary section.
          {
            echo "## SLO scenarios"
            echo ""
            echo '```'
            grep -E '^slo\.' build/perf-slos.log || echo "(no slo.* lines captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Run connector + ICE micro-benchmarks
        run: |
          set -o pipefail
          mkdir -p build
          cargo bench -p qlink-core --bench connector 2>&1 | tee build/perf-connector.log
          cargo bench -p qlink-core --bench ice 2>&1 | tee build/perf-ice.log
          {
            echo ""
            echo "## Connector micro-benchmarks"
            echo '```'
            grep -E 'time:|^connector/' build/perf-connector.log || true
            echo '```'
            echo ""
            echo "## ICE round-trip"
            echo '```'
            grep -E 'time:|^ice/' build/perf-ice.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload criterion HTML report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-${{ github.run_id }}
          path: target/criterion
          if-no-files-found: warn

      - name: Upload perf logs
        uses: actions/upload-artifact@v4
        with:
          name: perf-logs-${{ github.run_id }}
          path: build/perf-*.log
          if-no-files-found: warn

  swift-perf:
    name: Swift XCTest performance
    runs-on: macos-15
    needs: rust-benchmarks
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: cargo build -p qlink-core --release
      - name: Run Swift perf tests
        run: |
          QLINK_CORE_DYLIB="$PWD/target/release/libqlink_core.dylib" \
            swift test --filter RustMeshTransportPerformanceTests 2>&1 | tee build/perf-swift.log
        shell: bash
      - name: Upload Swift perf logs
        uses: actions/upload-artifact@v4
        with:
          name: perf-swift-${{ github.run_id }}
          path: build/perf-swift.log
          if-no-files-found: warn

  # FOLLOW-UP: real regression gating.
  #
  # The current workflow runs benches and uploads artifacts but does not yet
  # diff against a stored baseline. The next step is to:
  #   1. Commit a JSON baseline at docs/perf-baseline.json (one row per
  #      criterion benchmark + one row per SLO scenario).
  #   2. Add a `compare-against-baseline` job that parses build/perf-*.log,
  #      computes per-row deltas, and fails if any p50 regresses by >20%.
  #   3. Open an automated PR to refresh the baseline when intentional perf
  #      improvements land (`bench-update` label on a tag push).
  #
  # Tracked separately because regression gating on shared CI runners needs
  # variance characterization first; tightening too early would produce
  # constant false positives.

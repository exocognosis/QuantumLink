name: Performance

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    # Weekly at 06:00 UTC Monday: catches cross-merge regressions even
    # when nobody fires workflow_dispatch.
    - cron: "0 6 * * 1"

jobs:
  rust-benchmarks:
    name: Rust criterion benches + SLO scenarios
    runs-on: macos-15
    env:
      # Bench output is verbose; the SLO scenarios use println! to emit
      # one machine-parseable line per scenario.
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('Cargo.lock') }}

      - name: Pre-build dylib (for Swift step + cache warming)
        run: cargo build -p qlink-core --release

      - name: Prepare build/ directory for tee'd logs
        run: mkdir -p build

      - name: Run SLO scenarios (asserts product.md targets)
        id: slos
        run: |
          set -o pipefail
          cargo bench -p qlink-core --bench slos 2>&1 | tee build/perf-slos.log
          # Surface the slo.* lines as a job summary section.
          {
            echo "## SLO scenarios"
            echo ""
            echo '```'
            grep -E '^slo\.' build/perf-slos.log || echo "(no slo.* lines captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Run synthetic-WAN SLO scenarios
        id: slos_wan
        run: |
          set -o pipefail
          cargo bench -p qlink-core --bench slos_wan 2>&1 | tee build/perf-slos-wan.log
          {
            echo ""
            echo "## SLO scenarios — synthetic WAN"
            echo ""
            echo '```'
            grep -E '^slo\.' build/perf-slos-wan.log || echo "(no slo.* lines captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Run connector + ICE micro-benchmarks
        run: |
          set -o pipefail
          cargo bench -p qlink-core --bench connector 2>&1 | tee build/perf-connector.log
          cargo bench -p qlink-core --bench ice 2>&1 | tee build/perf-ice.log
          {
            echo ""
            echo "## Connector micro-benchmarks"
            echo '```'
            grep -E 'time:|^connector/' build/perf-connector.log || true
            echo '```'
            echo ""
            echo "## ICE round-trip"
            echo '```'
            grep -E 'time:|^ice/' build/perf-ice.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Compare against docs/perf-baseline.json (gates the job)
        # Runs after every bench step so the gate sees the full data.
        # Exits 1 if any metric regresses past the baseline's
        # `regression_threshold_pct` (default 20%) or if a metric the
        # baseline expects is missing from the bench output.
        run: |
          set -o pipefail
          cargo build -p qlink-core --bin perfgate --release
          set +e
          target/release/perfgate \
            --baseline docs/perf-baseline.json \
            --slo-log build/perf-slos.log \
            --slo-log build/perf-slos-wan.log \
            --criterion-dir target/criterion 2>&1 | tee build/perf-gate.log
          gate_exit=${PIPESTATUS[0]}
          set -e
          {
            echo ""
            echo "## Perf gate"
            echo '```'
            cat build/perf-gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_exit"
        shell: bash

      - name: Upload criterion HTML report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-${{ github.run_id }}
          path: target/criterion
          if-no-files-found: warn

      - name: Upload perf logs
        uses: actions/upload-artifact@v4
        with:
          name: perf-logs-${{ github.run_id }}
          path: build/perf-*.log
          if-no-files-found: warn

  swift-perf:
    name: Swift XCTest performance
    runs-on: macos-15
    needs: rust-benchmarks
    steps:
      - uses: actions/checkout@v7
      - name: Build dylib
        run: cargo build -p qlink-core --release
      - name: Run Swift perf tests
        run: |
          QLINK_CORE_DYLIB="$PWD/target/release/libqlink_core.dylib" \
            swift test --filter RustMeshTransportPerformanceTests 2>&1 | tee build/perf-swift.log
        shell: bash
      - name: Upload Swift perf logs
        uses: actions/upload-artifact@v4
        with:
          name: perf-swift-${{ github.run_id }}
          path: build/perf-swift.log
          if-no-files-found: warn

  # Refreshing the baseline when intentional perf changes land:
  #   1. Run the suites locally (`cargo bench --bench slos|connector|ice`).
  #   2. Update `docs/perf-baseline.json` with the new numbers.
  #   3. Update the table in `docs/perf-baseline.md` to match.
  #   4. Commit both — the gate uses the JSON, humans read the markdown.

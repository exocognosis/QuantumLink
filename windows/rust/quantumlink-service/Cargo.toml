[package]
name = "quantumlink-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "QuantumLink privileged Windows tunnel service: Wintun adapter, Rust packet pump, named-pipe IPC, WFP kill switch, DPAPI secrets"

[[bin]]
name = "quantumlink-service"
path = "src/main.rs"

[lib]
name = "quantumlink_service"
path = "src/lib.rs"

[dependencies]
qlink-core = { path = "../../../qlink-core" }
quantumlink-proto = { path = "../quantumlink-proto" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Rpc",
] }

[dev-dependencies]
tempfile = "3"

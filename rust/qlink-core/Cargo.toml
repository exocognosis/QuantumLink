[package]
name = "qlink-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[lib]
name = "qlink_core"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "qlinkctl"
path = "src/bin/qlinkctl.rs"

[[bin]]
name = "perfgate"
path = "src/bin/perfgate.rs"

[[bin]]
name = "qlinkhelper"
path = "src/bin/qlinkhelper.rs"

[[bin]]
name = "qlinkd"
path = "src/bin/qlinkd.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
# libc gives us raw socket / ioctl primitives for the userspace tun
# implementation (macOS utun, Linux /dev/net/tun). We deliberately
# avoid the `tun` crate because on macOS we need to accept a pre-
# opened file descriptor passed from the privileged helper over
# SCM_RIGHTS rather than calling open() ourselves.
libc = "0.2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
flume = { version = "0.11", default-features = false }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
mdns-sd = { version = "0.13", default-features = false, features = ["async"] }
ml-dsa = { version = "0.1.0-rc.8", features = ["zeroize"] }
ml-kem = { version = "0.3.0-rc.2", features = ["getrandom", "zeroize"] }
quinn = { version = "0.11.9", default-features = true }
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
rcgen = "0.14.7"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
slh-dsa = { version = "0.2.0-rc.4", features = ["zeroize"] }
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "html_reports"] }
tempfile = "3"

[[bench]]
name = "connector"
harness = false

[[bench]]
name = "ice"
harness = false

[[bench]]
name = "slos"
harness = false

[[bench]]
name = "slos_wan"
harness = false

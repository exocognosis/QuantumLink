[package]
name = "qlink-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[lib]
name = "qlink_core"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "qlinkctl"
path = "src/bin/qlinkctl.rs"

[[bin]]
name = "perfgate"
path = "src/bin/perfgate.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
dytallix-core = { git = "https://github.com/DytallixHQ/dytallix-sdk", rev = "657d0db4794904f7c25192c9d0c1039c5b9fe5f0", package = "dytallix-core" }
dytallix-sdk = { git = "https://github.com/DytallixHQ/dytallix-sdk", rev = "657d0db4794904f7c25192c9d0c1039c5b9fe5f0", package = "dytallix-sdk", features = ["network"] }
flume = { version = "0.12", default-features = false }
getrandom = "0.4"
hex = "0.4"
# Optional TURN (`turn-relay` feature) auth primitives. Standard TURN long-term
# credentials require HMAC-SHA1 + MD5 (RFC 5389/5766); these are excluded from
# the default PQC-only build and only linked when `turn-relay` is enabled.
hmac = { version = "0.12", optional = true }
md-5 = { version = "0.11", optional = true }
mdns-sd = { version = "0.20", default-features = false, features = ["async"] }
# Keep the PQC signature crates on the same release-candidate dependency line
# until slh-dsa supports the stable pkcs8 0.11 API.
ml-dsa = { version = "=0.1.0-rc.8", features = ["zeroize"] }
ml-kem = { version = "=0.3.0-rc.2", features = ["getrandom", "zeroize"] }
quinn = { version = "0.11.9", optional = true, default-features = false, features = ["bloom", "log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14.7", optional = true }
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
sha2 = "0.11"
sha3 = "0.12"
shake = "0.1"
slh-dsa = { version = "=0.2.0-rc.4", features = ["zeroize"] }
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", optional = true }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[features]
default = ["native-udp-carrier"]
native-udp-carrier = []
dev-quic-carrier = ["dep:quinn", "dep:rustls", "dep:rcgen"]
public-edge-tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls"]
# Standard TURN relay-candidate client. Off by default; pulls in the classical
# HMAC-SHA1 + MD5 primitives that RFC 5389/5766 TURN auth mandates.
turn-relay = ["dep:hmac", "dep:md-5", "dep:sha1"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["async_tokio", "html_reports"] }
quantumlink-node-registry-v2 = { path = "../dytallix/quantumlink-node-registry-v2" }
tempfile = "3"

[[bench]]
name = "connector"
harness = false
required-features = ["dev-quic-carrier"]

[[bench]]
name = "ice"
harness = false
required-features = ["dev-quic-carrier"]

[[bench]]
name = "slos"
harness = false
required-features = ["dev-quic-carrier"]

[[bench]]
name = "slos_wan"
harness = false
required-features = ["dev-quic-carrier"]
